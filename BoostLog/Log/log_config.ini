[Logging]
; 日志模式：debug（调试模式）/release（发布模式）/none（禁用日志）
Mode=debug
; 输出类型：console（仅控制台）/file（仅文件）/both（控制台+文件）
OutputType=both
; 日志文件存储目录（相对路径或绝对路径）
LogDir=./logs
; 发布模式日志文件名前缀（自动添加日期和.log后缀）
FileName=app
; 调试模式日志文件名前缀（自动添加日期和.log后缀）
DebugFileName=debug
; 是否按日期分割日志（true=按日分割，false=仅按大小分割）
RotateByDate=true
; 是否立即刷新日志缓冲区（true=实时写入，避免崩溃丢失日志）
AutoFlush=true
; 单个日志文件最大大小（单位：MB），超过则自动分割
MaxSizeMB=10
; 最多保留的日志文件数量（超过自动删除最旧文件）
MaxFiles=10
; 日志文件最大保留天数（超过自动删除过期文件）
MaxDays=7
; 最小日志级别：trace/debug/info/warning/error/fatal（低于该级别的日志不输出）
MinLevel=trace
; 最小日志级别：trace/debug/info/warning/error/fatal（低于该级别的日志不输出）
UIMinLevel=info
; 开发阶段设为false（同步），发布阶段设为true（异步）
UseAsyncSink=false
